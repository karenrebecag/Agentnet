version: 2

# The repository name is capitalized; archives keep the binary's name.
project_name: agentnet

# No brews: a formula needs a tap and a token that can push it.
# The default GITHUB_TOKEN of this repository cannot write another repository.

builds:
  - id: agentnet
    main: ./cmd/agentnet
    binary: agentnet
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64
    flags:
      - -trimpath
    ldflags:
      - -s -w -X github.com/karenrebecag/agentnet/internal/cli.Version={{.Version}}

archives:
  - id: agentnet
    formats: [tar.gz]

checksum:
  name_template: checksums.txt

sboms:
  - id: archive
    artifacts: archive

release:
  prerelease: auto
